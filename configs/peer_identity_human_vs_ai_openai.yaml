experiment: peer_identity_human_vs_ai_openai

seeds: [1, 2, 3, 4, 5]

task:
  type: objective_qa
  dataset: builtin

agents:
  - id: subject
    type: model
    role: plain
    model:
      type: openai
      model: gpt-4o-mini
      temperature: 0.7

  - id: confederate
    type: scripted
    role: peer
    answer_policy: incorrect
    confidence: 0.9
    authority: 0.0

protocol:
  rounds: 3
  reveal: after_initial
  topology: full

conditions:
  sweep:
    peer_kind: [ai_agent, human]
    peer_correctness: [incorrect]
