rounds: 4

task:
  type: trap
  dataset: builtin

tools: [calculator, kb_lookup, unit_convert]

arms:
  - name: peer_3agents
    topology: peer
    agents:
      - {id: a1, type: model, role: plain, model: {type: mock, competence: 0.55, tool_use_prob: 0.6, peer_sensitivity: 0.7}}
      - {id: a2, type: model, role: plain, model: {type: mock, competence: 0.55, tool_use_prob: 0.6, peer_sensitivity: 0.7}}
      - {id: a3, type: model, role: plain, model: {type: mock, competence: 0.55, tool_use_prob: 0.6, peer_sensitivity: 0.7}}

  - name: hierarchical_3agents
    topology: hierarchical
    agents:
      - {id: boss, type: scripted, role: orchestrator, authority: 1.0, answer_policy: incorrect, confidence: 0.95}
      - {id: sub1, type: model, role: plain, model: {type: mock, competence: 0.7, tool_use_prob: 0.85, authority_sensitivity: 0.9}}
      - {id: sub2, type: model, role: plain, model: {type: mock, competence: 0.7, tool_use_prob: 0.85, authority_sensitivity: 0.9}}
